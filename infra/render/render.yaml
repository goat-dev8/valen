# VALEN Render Blueprint — Phase 6 production layout
# https://render.com/docs/blueprint-spec
#
# Free-tier ($0) runtime: valen-redis (Key Value) + valen-api (Web, API+Worker combined).
# valen-scheduler (Cron) is a paid add-on (~$1/mo minimum) — disable in dashboard for strict $0.
#
# Secrets: copy from backend/.env into the valen-production env group in Render Dashboard.
# Do NOT copy backend/.env REDIS_URL (localhost) — REDIS_URL is wired from valen-redis below.

services:
  - type: keyvalue
    name: valen-redis
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: valen-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health/live
    # API + BullMQ worker in one container (worker has no free Render service type).
    envVars:
      - key: NODE_ENV
        value: production
      - key: VALEN_WORKER_MODE
        value: pipeline
      - key: PORT
        value: "3000"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: valen-redis
          property: connectionString
      - fromGroup: valen-production

  - type: cron
    name: valen-scheduler
    runtime: docker
    plan: starter
    region: oregon
    schedule: "*/5 * * * *"
    dockerfilePath: ./backend/Dockerfile.scheduler
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: valen-redis
          property: connectionString
      - fromGroup: valen-production

envVarGroups:
  - name: valen-production
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: ALCHEMY_API_KEY
        sync: false
      - key: PRIVATE_KEY
        sync: false
      - key: OPERATOR_DASHBOARD_SECRET
        sync: false
      - key: ARBITRUM_SEPOLIA_RPC_URL
        sync: false
      - key: ROBINHOOD_TESTNET_RPC_URL
        sync: false
      - key: ARBITRUM_SEPOLIA_VALEN_REGISTRY
        sync: false
      - key: ARBITRUM_SEPOLIA_VALEN_SETTLEMENT
        sync: false
      - key: ROBINHOOD_TESTNET_VALEN_REGISTRY
        sync: false
      - key: ROBINHOOD_TESTNET_VALEN_SETTLEMENT
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: POSTHOG_API_KEY
        sync: false
      - key: POSTHOG_HOST
        sync: false
